name: CI

on:
  push:
    branches: [main, v0.1]
  pull_request:
    branches: [main, v0.1]

jobs:
  test:
    runs-on: ubuntu-latest
    # 3.15 is a non-blocking probe only: its job may fail without failing the
    # workflow. Known hazard on 3.15: PEP 810 lazy imports change when import
    # side effects run, so never set PYTHON_LAZY_IMPORTS in CI.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      # A 3.15 failure must never cancel the blocking 3.12 / 3.13 / 3.14 jobs.
      fail-fast: false
      matrix:
        # Keep ONE matrix key. Branch protection requires a status check named
        # exactly `test (3.12)`; a second key would rename every job (for
        # example `test (3.12, false)`) and leave PRs waiting on a missing check.
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Lets the 3.15 probe resolve while only pre-releases exist; has no
          # effect on versions that already have a final release.
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      # Three-valued: 0 clean · 1 a citation drifted (re-anchor it) · 2 the gate
      # could not verify (an unregistered unverifiable citation, an absent cited
      # source, a stale/over-ratchet citation-baseline.json, or zero citations
      # graded). Both 1 and 2 fail the step; the script's report says which.
      - name: Protocol-doc citation drift check
        run: python scripts/check_protocol_doc_citations.py

      - name: Test
        run: pytest tests/ -x --tb=short
