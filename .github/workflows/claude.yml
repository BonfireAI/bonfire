name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Every trigger this workflow accepts runs in the BASE repository context and
  # therefore has access to ``secrets.CLAUDE_CODE_OAUTH_TOKEN``. The event body
  # is also the agent's prompt. So the ``@claude`` mention alone is not a gate:
  # without an author check, any account on the internet can both spend the
  # repository owner's Claude budget and choose what the agent is told to do.
  #
  # Each clause below pairs the mention check with an ``author_association``
  # allow-list. All four trigger types are covered, and each reads the
  # association off the object that actually carries the ``@claude`` text:
  #
  #   issue_comment                -> github.event.comment.author_association
  #   pull_request_review_comment  -> github.event.comment.author_association
  #   pull_request_review          -> github.event.review.author_association
  #   issues                       -> github.event.issue.author_association
  #
  # A filter on three of the four is a hole with extra steps, so the list is
  # kept exhaustive against the ``on:`` block above -- adding a trigger there
  # without adding a clause here leaves the job unreachable rather than
  # unguarded, which is the failure direction we want.
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

