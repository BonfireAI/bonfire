name: Release

# PyPI release workflow for `bonfire-ai`.
#
# Triggered by pushing a version tag (`vX.Y.Z` for stable, `vX.Y.ZaN` /
# `vX.Y.ZbN` / `vX.Y.ZrcN` for pre-releases). The `build` job assembles
# the wheel + sdist and twine-checks both; the `publish` job uploads them
# to PyPI via the `pypa/gh-action-pypi-publish` action.
#
# Auth path: PyPI Trusted Publisher (OIDC). No API token is referenced —
# the `id-token: write` permission plus the `pypi` GitHub Environment let
# `pypa/gh-action-pypi-publish` mint a short-lived OIDC token that PyPI
# verifies against the Trusted Publisher binding registered for the
# `bonfire-ai` project.
#
# Prerequisites (configured outside this workflow, one-time):
#   1. PyPI project `bonfire-ai` has a Trusted Publisher binding pointing
#      at `BonfireAI/bonfire`, workflow `release.yml`, environment `pypi`.
#   2. GitHub Environment `pypi` exists on this repo (Settings →
#      Environments). Optional reviewer protection lives there.
#
# See `CLAUDE.md` § "Release Policy and Gates" and `docs/release-policy.md`
# for what blocks a `v0.1.0` tag.
#
# The build job also runs scripts/check_tag_version.py, which fails the build
# (and so the publish) when the tag does not equal "v" + project.version.
#
# `workflow_dispatch` is enabled so a maintainer can manually re-run the
# pipeline from the Actions tab if a tag-driven run fails partway through.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*a*"
      - "v*.*.*b*"
      - "v*.*.*rc*"
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes per ref. A re-pushed tag (or a manual dispatch on a
# tag) waits behind any in-flight publish for that same ref rather than
# racing it. `cancel-in-progress: false` because PyPI does not allow
# re-uploading a version — never abort a run mid-publish.
concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel + sdist
    # Guard the entire pipeline on a tag ref. `workflow_dispatch` is enabled
    # for re-running a tag-driven build, but a dispatch from `main` or a
    # feature branch must not attempt to build for publish. `publish` needs
    # `build`, so a skipped build cascades to a skipped publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (node24)
        with:
          python-version: "3.12"

      - name: Release version-truth guard (tag must equal declared version)
        # Tripwire: this workflow publishes on ANY v*.*.* tag push, so a tag
        # that disagrees with pyproject.toml would ship a wrong public
        # release. Fail closed, with a typed error, before anything builds.
        run: python scripts/check_tag_version.py "${GITHUB_REF_NAME}"

      - name: Install build frontend
        # These pins equal the publisher's bundled twine and packaging, so
        # `twine check` measures with the same instrument that uploads.
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine==7.0.0 packaging==26.2

      - name: Build wheel + sdist
        run: python -m build

      - name: Inspect built artifacts (twine check)
        # `--strict` fails on README rendering warnings so a release never
        # ships with a broken project page on PyPI.
        run: python -m twine check --strict dist/*

      - name: Upload built artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publisher)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publisher OIDC auth
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (node24)
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        # Pinned to the v1.14.3 commit SHA rather than the floating
        # `release/v1` ref for supply-chain hardening. v1.14.3 bundles
        # twine 7.0.0 + packaging 26.2, which accept Metadata-Version 2.5
        # (hatchling emits 2.5). v1.14.0 (the previous pin) rejected 2.5
        # wheels with `InvalidDistribution: '2.5' is not a valid metadata
        # version`, and is inside GHSA-5xjx-3w67-w9x9 (fixed in 1.14.3).
        # History: v1.12.2 (the pin before that) bundled a twine that
        # rejected Metadata-Version 2.4 wheels with `InvalidDistribution:
        # Metadata is missing required fields: Name, Version` during upload.
        # When bumping this SHA, update the build-job twine/packaging pins
        # from the action's `requirements/runtime.txt` at the new SHA.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
